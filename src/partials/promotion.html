<section class="promotion" aria-labelledby="promotion-title">
  <div class="container promotion__inner">
    <div class="promotion__copy">
      <h2 id="promotion-title">
        Get a chance to have an<br class="desktop-break" />
        Amazing morning
      </h2>
      <p>
        We are giving you a one-time opportunity to experience a better life
        with coffee.
      </p>
      <button class="button" type="button" data-order>Order Now</button>
    </div>
    <img
      class="promotion__cup"
      src="./img/takeaway-cup.webp"
      srcset="./img/takeaway-cup.webp 1x, ./img/takeaway-cup@2x.webp 2x"
      width="300"
      height="467"
      alt="Bean Scene takeaway coffee with a golden lid"
      loading="lazy"
    />
  </div>
  <img
    class="decoration promotion__beans"
    src="./img/coffee-beans.webp"
    srcset="./img/coffee-beans.webp 1x, ./img/coffee-beans@2x.webp 2x"
    width="657"
    height="574"
    alt=""
    loading="lazy"
  />
</section>
